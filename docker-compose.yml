# ─────────────────────────────────────────────────────────────────────────────
# Local development stack
#
# The Go app runs in Docker alongside a PostgreSQL database.
# llama.cpp runs NATIVELY on the host (brew install llama.cpp) on port 8080.
#
# Quick start (local LLM):
#   1. cp .env.example .env && fill in GitHub App credentials + GROQ_API_KEY
#   2. make download-model
#   3. make llm          ← terminal 1: starts llama.cpp on host port 8080
#   4. make up           ← terminal 2: starts Go app + Postgres in Docker
#   5. make ngrok        ← terminal 3: exposes port 3000 to GitHub
#
# Quick start (Groq / external API — no local LLM needed):
#   1. cp .env.example .env && fill in GitHub App creds + GROQ_API_KEY
#   2. Remove AI_PROVIDER override below (or set it to groq)
#   3. make up
#   4. make ngrok
#
# host.docker.internal resolves to the host machine from inside the container.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL (usage tracking + per-installation config) ───────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diffsense
      POSTGRES_USER: diffsense
      POSTGRES_PASSWORD: diffsense_local
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diffsense"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── AI Code Reviewer (Go app) ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # DATABASE_URL points to the local Postgres service.
      # AI provider comes from .env — set AI_PROVIDER=local there to use llama.cpp,
      # or AI_PROVIDER=groq (+ GROQ_API_KEY) to use Groq without running llama.cpp.
      DATABASE_URL: postgresql://diffsense:diffsense_local@postgres:5432/diffsense?sslmode=disable
      # Uncomment to force local LLM (requires: make llm running in a separate terminal):
      # AI_PROVIDER: local
      # LOCAL_LLM_URL: http://host.docker.internal:8080
    volumes:
      - ./diffsense-ai.2026-06-12.private-key.pem:/app/diffsense-ai.2026-06-12.private-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
