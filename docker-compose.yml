# ─────────────────────────────────────────────────────────────────────────────
# Local development stack
#
# The Go app runs in Docker.
# llama.cpp runs NATIVELY on the host (brew install llama.cpp).
#
# Quick start:
#   1. cp .env.example .env && fill in GitHub App credentials
#   2. make download-model
#   3. make llm          ← terminal 1: starts llama.cpp on host port 8080
#   4. make up           ← terminal 2: starts the Go app in Docker
#   5. make ngrok        ← terminal 3: exposes port 3000 to GitHub
#
# host.docker.internal resolves to the host machine from inside the container.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── AI Code Reviewer (Go app) ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      AI_PROVIDER: local
      # host.docker.internal → resolves to your Mac from inside the container
      LOCAL_LLM_URL: http://host.docker.internal:8080
      LOCAL_LLM_MODEL: qwen2.5-coder
    volumes:
      # Mount the private key file into the container at the same relative path
      - ./diffsense-ai.2026-06-12.private-key.pem:/app/diffsense-ai.2026-06-12.private-key.pem:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── To use an external API provider instead of local LLM ────────────────────
  # Set in .env:
  #   AI_PROVIDER=openai          OPENAI_API_KEY=sk-...
  #   AI_PROVIDER=claude          ANTHROPIC_API_KEY=sk-ant-...
  #   AI_PROVIDER=gemini          GEMINI_API_KEY=AIza...
  #   AI_PROVIDER=grok            GROK_API_KEY=xai-...
